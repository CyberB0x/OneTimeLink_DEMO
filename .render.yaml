services:
  - type: web
    name: onetimelink-demo
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn onetimelink_demo.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onetimelink-db
          property: connectionString

databases:
  - name: onetimelink-db
    plan: free
